version: '3.8'

services:
  uns-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uns-sentinel-explorer
    ports:
      - "4000:4000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - VITE_GATEWAY_URL=http://localhost:4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - uns-network
    labels:
      - "com.uns-sentinel.version=1.0.0"
      - "com.uns-sentinel.maintainer=nimish.nirmal@outlook.com"

networks:
  uns-network:
    driver: bridge